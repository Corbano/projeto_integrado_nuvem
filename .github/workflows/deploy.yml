name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -e
            REPO_URL="https://github.com/Corbano/projeto_integrado_nuvem.git"
            APP_DIR="$HOME/app"
            export PATH="$HOME/.local/bin:$PATH"

            # ---------- Codigo ----------
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            # ---------- Backend (FastAPI) ----------
            cd "$APP_DIR/backend"

            # .env criado uma unica vez no servidor (segredo gerado aqui, nunca vai ao Git)
            if [ ! -f .env ]; then
              JWT="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
              {
                echo "ENVIRONMENT=development"
                echo "DATABASE_URL=sqlite:///./autocenter.db"
                echo "JWT_SECRET=$JWT"
                echo "STORAGE_BACKEND=local"
              } > .env
              chmod 600 .env
            fi

            # uv instala o Python 3.12 (o mesmo do CI) sem depender do Python do sistema
            command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
            [ -d .venv ] || uv venv --python 3.12 .venv
            uv pip install --python .venv/bin/python -r requirements.txt
            .venv/bin/alembic upgrade head

            pm2 delete backend 2>/dev/null || true
            pm2 start .venv/bin/uvicorn --name backend --interpreter none -- \
              app.main:app --host 127.0.0.1 --port 8000

            # ---------- Frontend (build estatico servido pelo Nginx) ----------
            cd "$APP_DIR/frontend"
            npm ci
            VITE_API_URL=/api/v1 npm run build
            rm -rf /var/www/app/*
            cp -r dist/* /var/www/app/

            pm2 save
            sudo nginx -t && sudo systemctl reload nginx
            echo "Deploy concluido"
